name: 实时交易监控

on:
  schedule:
    # GitHub 用 UTC 时间，北京时间 = UTC+8
    # 目标：周一到周五，北京时间 9:00-15:30，每5分钟一次
    # 北京 9:00-14:55 = UTC 1:00-6:55
    - cron: '*/5 1-6 * * 1-5'
    # 北京 15:00-15:30 = UTC 7:00-7:30（7点只跑到30分截止）
    - cron: '0-30/5 7 * * 1-5'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: 运行实时交易监控
        env:
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python monitor.py --mode trade
